<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Fantasy Town v0.0.0.5</title>
<style>
html,body{margin:0;height:100%;background:#05030f;overflow:hidden;touch-action:none;font-family:monospace;color:#e8f7ff}
canvas{display:block;image-rendering:pixelated;width:100vw;height:100vh}
#menu{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:#120b2b;border:3px solid #3ff;box-shadow:0 0 18px #3ff,inset 0 0 12px #f0f6;padding:14px 18px;min-width:260px;max-width:90vw;display:none;font-size:15px;z-index:5}
#menu h3{margin:0 0 8px;color:#ffd84a;text-shadow:0 0 6px #f80}
#menu button{display:block;width:100%;margin:5px 0;background:#1d1446;color:#bff;border:2px solid #f3c;padding:7px;font:inherit;cursor:pointer;text-align:left}
#menu button:hover{background:#2c1f66}
#touch{display:none;position:fixed;inset:0;pointer-events:none;z-index:4}
.tb{position:absolute;pointer-events:auto;width:56px;height:56px;border-radius:12px;background:#1d14468c;border:2px solid #3ffb;color:#bff;font:bold 20px monospace;display:flex;align-items:center;justify-content:center;user-select:none;-webkit-user-select:none}
</style></head><body>
<canvas id="c"></canvas>
<div id="menu"></div>
<div id="touch">
 <div class="tb" data-k="up" style="left:70px;bottom:130px">▲</div>
 <div class="tb" data-k="down" style="left:70px;bottom:10px">▼</div>
 <div class="tb" data-k="left" style="left:10px;bottom:70px">◀</div>
 <div class="tb" data-k="right" style="left:130px;bottom:70px">▶</div>
 <div class="tb" data-k="act" style="right:20px;bottom:60px;width:72px;height:72px;border-radius:50%;border-color:#f3c">A</div>
 <div class="tb" data-k="tool" style="right:104px;bottom:20px;border-radius:50%">B</div>
 <div class="tb" data-k="map" style="left:10px;top:110px;width:48px;height:40px;font-size:13px">MAP</div>
</div>
<script src="game.js"></script>
</body></html>
