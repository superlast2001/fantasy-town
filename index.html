<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#2a2238">
<title>Fantasy Town v0.0.1.5</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#2a2238;overflow:hidden;touch-action:none;font-family:"Trebuchet MS",Verdana,sans-serif;color:#2a2238;-webkit-user-select:none;user-select:none}
canvas#c{display:block;width:100vw;height:100vh}
/* top bar */
#top{position:fixed;left:0;right:0;top:0;height:58px;pointer-events:none;z-index:3;display:flex;justify-content:space-between;align-items:flex-start;padding:6px calc(env(safe-area-inset-right) + 8px) 0 calc(env(safe-area-inset-left) + 8px)}
.tl{pointer-events:auto;display:flex;flex-direction:column;gap:3px}
#timerWrap{background:#2a2238;clip-path:polygon(0 0,100% 0,92% 100%,0 100%);padding:3px 26px 3px 10px;border-bottom:3px solid #ffb43a;position:relative;min-width:200px}
#timerWrap:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(-45deg,#ffd84a 0 8px,#2a2238 8px 16px);opacity:.18}
#timer{position:relative;color:#ffd84a;font-weight:bold;font-size:13px;letter-spacing:1px}
#goldWrap{display:flex;align-items:center;gap:6px;background:#fff;border:3px solid #2a2238;border-radius:4px 14px 14px 4px;padding:1px 10px 1px 6px;font-weight:bold;font-size:15px;width:max-content;box-shadow:0 2px 0 #2a2238}
#goldWrap .h{color:#ff3a6a;font-size:15px}#hearts{font-size:11px;color:#ff3a6a;margin-left:6px}
#where{font-size:10px;color:#fff;text-shadow:0 1px 2px #000;margin-left:4px}
#res{pointer-events:auto;display:flex;gap:4px;background:rgba(255,255,255,.88);border:2px solid #2a2238;border-radius:14px;padding:3px 8px;margin-top:2px}
.chip{font-weight:bold;font-size:12px;display:flex;align-items:center;gap:3px;min-width:34px}
.ic{width:13px;height:13px;border-radius:4px;border:1.5px solid #2a2238;display:inline-block}
.ic-wood{background:linear-gradient(#c8945a,#8a5a34)}.ic-ore{background:linear-gradient(#bfe8ff,#6e7a94);transform:rotate(45deg) scale(.8)}.ic-scrap{background:linear-gradient(#d8c8a0,#8a7a60)}.ic-shell{background:radial-gradient(circle at 50% 100%,#fff,#ffb0d8);border-radius:8px 8px 3px 3px}.ic-neon{background:linear-gradient(#ffd0f4,#ff4fd8);border-radius:2px;width:7px}.ic-fish{background:linear-gradient(90deg,#7af0ff,#2090c0);border-radius:8px 3px 3px 8px}
.tr{pointer-events:auto;display:flex;gap:0}
#note{background:linear-gradient(#5aa8ff,#2a6ad8);color:#fff;font-weight:bold;font-style:italic;font-size:16px;padding:8px 24px 8px 30px;clip-path:polygon(14% 0,100% 0,100% 100%,0 100%);border-bottom:3px solid #1a3a8a;cursor:pointer;letter-spacing:2px}
#gear{background:#1a3a8a;color:#fff;font-size:20px;width:42px;height:39px;display:flex;align-items:center;justify-content:center;cursor:pointer;border-radius:0 6px 6px 0}
/* back + talk */
#back{position:fixed;left:0;bottom:0;width:62px;height:62px;background:#ffd84a;clip-path:polygon(0 0,100% 100%,0 100%);display:none;z-index:4;cursor:pointer}
#back:after{content:"←";position:absolute;left:8px;bottom:4px;font-size:22px;font-weight:bold;color:#2a2238}
#back.show{display:block}
#talk{position:fixed;right:calc(env(safe-area-inset-right) + 96px);bottom:14px;display:none;z-index:4;background:linear-gradient(#7aff7a,#2ab84a);color:#fff;font-weight:bold;font-style:italic;font-size:16px;letter-spacing:1px;padding:10px 22px;clip-path:polygon(10% 0,100% 0,90% 100%,0 100%);border-bottom:4px solid #1a7a2a;text-shadow:0 1px 0 #1a7a2a;cursor:pointer}
body:not(.touch) #talk{right:20px}
#talk.show{display:block}
/* menus */
#menu{position:fixed;left:50%;top:52%;transform:translate(-50%,-50%);background:#fff;border:3px solid #2a2238;border-radius:18px;box-shadow:0 6px 0 #2a2238;padding:12px 16px;width:min(560px,88vw);max-height:78vh;overflow:auto;display:none;font-size:14px;z-index:6}
#menu h3{margin:0 0 6px;color:#2a2238}#menu p{margin:6px 0}
#menu .row{display:flex;flex-wrap:wrap;gap:6px}#menu .row button{width:auto;flex:1 1 45%}
#menu button{display:block;width:100%;margin:5px 0;background:#f4f0f8;color:#2a2238;border:2px solid #2a2238;border-radius:12px;padding:8px;font:inherit;font-weight:bold;cursor:pointer;text-align:left}
#menu button:hover{background:#fff4d0}#menu button.no{opacity:.45}#menu button.x{text-align:center;background:#ffd84a}
/* dialogue */
#dlg{position:fixed;inset:0;z-index:7;display:none;background:rgba(20,10,40,.55)}
#dlgPortrait{position:absolute;left:50%;bottom:0;height:84%;transform:translateX(-88%);filter:drop-shadow(0 6px 10px rgba(0,0,0,.35))}
#dlgBox{position:absolute;left:50%;transform:translateX(-24%);bottom:12px;width:min(520px,62vw);background:#fff;border:3px solid #2a2238;border-radius:22px;padding:18px 18px 34px;min-height:110px;box-shadow:0 5px 0 #2a2238}
#dlgBox:after{content:"";position:absolute;right:30px;bottom:-16px;border:9px solid transparent;border-top:12px solid #2a2238}
#dlgName{position:absolute;left:16px;top:-15px;background:#fff;border:3px solid #2a2238;border-radius:8px;padding:1px 12px;font-weight:bold;font-size:13px;letter-spacing:1px}
#dlgText{font-weight:bold;font-size:16px;line-height:1.35;min-height:44px}
.dbt{position:absolute;bottom:8px;font-size:13px;color:#2a2238;cursor:pointer;background:none;border:none;font:inherit;font-weight:bold;padding:4px 8px}
#dlgSkip{left:12px}#dlgHide{left:50%;transform:translateX(-50%)}#dlgNext{right:12px}
#menu .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}#menu .grid button.it{text-align:center;font-size:11px;line-height:1.3;margin:0}#menu .grid img{width:64px;height:64px;display:block;margin:0 auto 2px}
.th{display:inline-block;color:#fff;border-radius:8px;padding:0 6px;font-size:10px;margin-left:3px}.rq{display:inline-block;background:#2a2238;color:#ffd84a;border-radius:8px;padding:0 5px;font-size:9px;margin-left:3px}
#menu{width:min(760px,92vw)!important}
/* tenant card */
#tcard{position:fixed;left:calc(env(safe-area-inset-left) + 70px);bottom:12px;z-index:5;display:none;gap:10px;align-items:center;background:#fff;border:3px solid #2a2238;border-radius:18px;padding:6px 30px 6px 6px;box-shadow:0 4px 0 #2a2238}
#tcPortrait{width:64px;height:64px;border-radius:50%;border:3px solid #ffb43a}
#tcName{font-weight:bold;font-size:15px}#tcInfo{font-size:11px;color:#5a4a6a;margin:2px 0 4px;line-height:1.3}
.tcb{display:flex;gap:5px}.tcb button{font:inherit;font-weight:bold;font-size:12px;border:2px solid #2a2238;border-radius:12px;padding:4px 10px;cursor:pointer;background:#ffd84a;color:#2a2238}
#tFollow{background:#ff6ab0!important;color:#fff!important}#tHang.dim{opacity:.45}#tX{position:absolute;right:6px;top:4px;border:none;background:none;font-size:14px;cursor:pointer}
@media (max-height:430px){#tcard{padding:4px 26px 4px 4px;bottom:6px}#tcPortrait{width:48px;height:48px}#tcName{font-size:13px}#tcInfo{font-size:10px}.tcb button{font-size:11px;padding:3px 8px}}
/* touch controls */
#touch{display:none;position:fixed;inset:0;pointer-events:none;z-index:4}
body.touch #touch{display:block}body.modal #touch,body.modal #talk{display:none!important}body.mapopen #top{display:none}body.modal #res{visibility:hidden}
.tb{position:absolute;pointer-events:auto;width:50px;height:50px;border-radius:14px;background:rgba(255,255,255,.85);border:3px solid #2a2238;color:#2a2238;font:bold 17px sans-serif;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 0 #2a2238}
#brot{display:none!important}body.decor #brot{display:flex!important}
.tb:active{transform:translateY(2px);box-shadow:0 1px 0 #2a2238}
.pill{width:auto;height:36px;padding:0 14px;border-radius:18px;font-size:13px}
.dp{display:none}body.dpad .dp{display:flex}
#rot{display:none;position:fixed;inset:0;z-index:9;background:#2a2238f4;color:#fff;flex-direction:column;align-items:center;justify-content:center;font:bold 20px sans-serif;text-align:center}
#rot .ph{width:60px;height:100px;border:4px solid #ffd84a;border-radius:12px;margin-bottom:20px;animation:r 2s infinite}
@keyframes r{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
@media (max-height:430px){#timer{font-size:11px}#goldWrap{font-size:13px}#note{font-size:13px;padding:6px 16px 6px 22px}#gear{height:32px;width:34px;font-size:16px}.chip{font-size:11px;min-width:30px}#dlgText{font-size:14px;min-height:36px}#dlgBox{padding:14px 14px 30px;min-height:90px}}
</style></head><body>
<canvas id="c"></canvas>
<div id="top">
 <div class="tl"><div id="timerWrap"><div id="timer">DAY 1</div></div><div id="goldWrap"><span class="h">♥</span><span id="gold">00000000</span><span id="hearts">0</span></div><div id="where"></div></div>
 <div id="res"></div>
 <div class="tr"><div id="note">NOTE</div><div id="gear">⚙</div></div>
</div>
<div id="back" title="Back"></div>
<div id="talk">TALK</div>
<div id="menu"></div>
<div id="tcard"><canvas id="tcPortrait" width="80" height="80"></canvas><div class="tci"><div id="tcName"></div><div id="tcInfo"></div><div class="tcb"><button id="tFollow">FOLLOW</button><button id="tTalk">TALK</button><button id="tHang">HANG OUT</button></div></div><button id="tX">✕</button></div>
<div id="dlg"><canvas id="dlgPortrait" width="420" height="520"></canvas><div id="dlgBox"><div id="dlgName">NAME</div><div id="dlgText"></div><button class="dbt" id="dlgSkip">Skip&gt;&gt;</button><button class="dbt" id="dlgHide">Hide</button><button class="dbt" id="dlgNext">Next &gt;</button></div></div>
<div id="touch">
 <div class="tb dp" data-k="up" style="left:calc(env(safe-area-inset-left) + 76px);bottom:124px">▲</div>
 <div class="tb dp" data-k="down" style="left:calc(env(safe-area-inset-left) + 76px);bottom:16px">▼</div>
 <div class="tb dp" data-k="left" style="left:calc(env(safe-area-inset-left) + 22px);bottom:70px">◀</div>
 <div class="tb dp" data-k="right" style="left:calc(env(safe-area-inset-left) + 130px);bottom:70px">▶</div>
 <div class="tb" data-k="act" style="right:calc(env(safe-area-inset-right) + 16px);bottom:14px;width:68px;height:68px;border-radius:50%;background:#ffd84a;font-size:15px">USE</div>
 <div class="tb" data-k="tool" style="display:none" data-x="right:calc(env(safe-area-inset-right) + 22px);bottom:96px;border-radius:50%;width:46px;height:46px;font-size:12px">NEXT</div>
 <div class="tb pill" id="brot" data-k="rotate" style="right:calc(env(safe-area-inset-right) + 80px);bottom:146px;background:#ffd0f0">ROTATE</div>
 <div class="tb pill" id="bbuild" data-k="build" style="right:calc(env(safe-area-inset-right) + 80px);bottom:100px;background:#9fff7a">DECOR</div>
 <div class="tb pill" data-k="map" style="right:calc(env(safe-area-inset-right) + 16px);top:56px;background:#bfe8ff">MAP</div>
</div>
<div id="rot"><div class="ph"></div>Rotate your phone<br><small style="font-size:13px;opacity:.8">Fantasy Town plays in landscape</small></div>
<script src="art.js"></script><script src="iso.js"></script><script src="objects.js"></script><script src="portrait.js"></script><script src="furniture.js"></script><script src="illus.js"></script><script src="lobby.js"></script><script src="town.js"></script><script src="game.js"></script>
</body></html>
