<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#05030f">
<title>Fantasy Town v0.0.0.6</title>
<style>
html,body{margin:0;height:100%;background:#05030f;overflow:hidden;touch-action:none;font-family:monospace;color:#e8f7ff;-webkit-user-select:none;user-select:none}
canvas{display:block;image-rendering:pixelated;width:100vw;height:100vh}
#menu{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:#120b2b;border:3px solid #3ff;box-shadow:0 0 18px #3ff,inset 0 0 12px #f0f6;padding:12px 16px;width:min(560px,88vw);max-height:84vh;overflow:auto;display:none;font-size:14px;z-index:5}
#menu h3{margin:0 0 6px;color:#ffd84a;text-shadow:0 0 6px #f80}
#menu p{margin:6px 0}
#menu .row{display:flex;flex-wrap:wrap;gap:6px}#menu .row button{width:auto;flex:1 1 45%}
#menu button{display:block;width:100%;margin:5px 0;background:#1d1446;color:#bff;border:2px solid #f3c;padding:8px;font:inherit;cursor:pointer;text-align:left}
#menu button.no{opacity:.5}#menu button.x{border-color:#3ff;text-align:center}
#touch{display:none;position:fixed;inset:0;pointer-events:none;z-index:4}
body.touch #touch{display:block}body.mapopen #touch .tb:not([data-k=map]){display:none}
.tb{position:absolute;pointer-events:auto;width:52px;height:52px;border-radius:12px;background:#1d14468c;border:2px solid #3ffb;color:#bff;font:bold 18px monospace;display:flex;align-items:center;justify-content:center}
.tb:active{background:#3ff6}
.pill{width:auto;height:34px;padding:0 12px;border-radius:17px;font-size:13px}
#rot{display:none;position:fixed;inset:0;z-index:9;background:#05030ff2;color:#3ff;flex-direction:column;align-items:center;justify-content:center;font:bold 20px monospace;text-align:center;text-shadow:0 0 10px #3ff}
#rot .ph{width:60px;height:100px;border:4px solid #ff4fd8;border-radius:10px;margin-bottom:20px;animation:r 2s infinite}
@keyframes r{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
</style></head><body>
<canvas id="c"></canvas>
<div id="menu"></div>
<div id="touch">
 <div class="tb" data-k="up" style="left:calc(env(safe-area-inset-left) + 70px);bottom:118px">▲</div>
 <div class="tb" data-k="down" style="left:calc(env(safe-area-inset-left) + 70px);bottom:10px">▼</div>
 <div class="tb" data-k="left" style="left:calc(env(safe-area-inset-left) + 16px);bottom:64px">◀</div>
 <div class="tb" data-k="right" style="left:calc(env(safe-area-inset-left) + 124px);bottom:64px">▶</div>
 <div class="tb" data-k="act" style="right:calc(env(safe-area-inset-right) + 18px);bottom:44px;width:72px;height:72px;border-radius:50%;border-color:#f3c;font-size:24px">A</div>
 <div class="tb" data-k="tool" style="right:calc(env(safe-area-inset-right) + 100px);bottom:12px;border-radius:50%">B</div>
 <div class="tb pill" data-k="build" style="right:calc(env(safe-area-inset-right) + 18px);bottom:130px;border-color:#3dff9a">BUILD</div>
 <div class="tb pill" data-k="map" style="right:calc(env(safe-area-inset-right) + 100px);bottom:84px;border-color:#ffd84a">MAP</div>
</div>
<div id="rot"><div class="ph"></div>Rotate your phone<br><small style="font-size:13px;color:#bff">Fantasy Town plays in landscape</small></div>
<script src="art.js"></script>
<script src="game.js"></script>
</body></html>
