<!doctype html><html><head><meta charset="utf-8"><title>Ares · character sheet (debug)</title><style>body{margin:0;background:#141018}canvas{display:block}</style></head><body><canvas id="c" width="1640" height="1040"></canvas>
<script src="art.js"></script><script src="iso.js"></script><script src="portrait.js"></script><script src="ares.js"></script>
<script>
const c=document.getElementById('c'),g=c.getContext('2d');g.fillStyle='#141018';g.fillRect(0,0,1640,1040);
const panel=(x,y,w,h,t)=>{g.beginPath();g.roundRect(x,y,w,h,10);g.fillStyle='#1e1824';g.fill();g.strokeStyle='#e8323a';g.lineWidth=2;g.stroke();g.font='bold 16px sans-serif';const tw=g.measureText(t).width+20;g.beginPath();g.roundRect(x+10,y-12,tw,24,8);g.fillStyle='#1e1824';g.fill();g.stroke();g.fillStyle='#fff';g.fillText(t,x+20,y+6);};
const cap=(x,y,t)=>{g.font='bold 12px sans-serif';g.textAlign='center';const w=g.measureText(t).width+14;g.beginPath();g.roundRect(x-w/2,y-10,w,20,6);g.fillStyle='#2a2230';g.fill();g.strokeStyle='#e8323a';g.lineWidth=1;g.stroke();g.fillStyle='#fff';g.fillText(t.toUpperCase(),x,y+4);g.textAlign='left';};
// dialogue CG
panel(14,20,330,600,'DIALOGUE CG');const bg=g.createLinearGradient(0,40,0,610);bg.addColorStop(0,'#ffd8a0');bg.addColorStop(1,'#7ac8ff');g.fillStyle=bg;g.fillRect(24,40,310,570);aresBody(g,180,600,64,{pose:'flex',expr:'smile'});
// turnaround
panel(360,20,560,330,'TURNAROUND');['front','right','back','left'].forEach((d,i)=>{aresBody(g,430+i*136,320,34,{dir:d,pose:'idle'});cap(430+i*136,334,d=='right'?'side (right)':d=='left'?'side (left)':d);});
// expressions
panel(936,20,690,330,'EXPRESSIONS (CLOSE UP)');ARES_EXPR.forEach((e,i)=>{const x=950+(i%4)*168,y=36+Math.floor(i/4)*156;g.save();g.beginPath();g.roundRect(x,y,158,130,8);g.clip();g.fillStyle='#3a2a3a';g.fillRect(x,y,158,130);g.drawImage(aresPortrait(e),40,0,340,340,x,y,158,158);g.restore();cap(x+79,y+138,e=='blush'?'blushing':e);});
// dialogue poses
panel(360,370,1266,320,'DIALOGUE POSES (FULL BODY)');['talking','laugh','teasing','embarrassed','angry','thinking','surprised','serious'].forEach((p,i)=>{const x=440+i*150;aresBody(g,x,650,30,{pose:p});cap(x,672,p);});
// chibi
panel(14,710,1612,316,'CHIBI / IN-GAME SPRITES');
g.save();g.scale(3,3);
['down','right','up','left'].forEach((f,i)=>{chibi(g,(40+i*36),300,{ares:1,face:f},0,false);});
for(let i=0;i<6;i++)chibi(g,(200+i*26),300,{ares:1,face:'right'},i*.105,true);
const em=[['heart',{emote:'heart',flex:1}],['angry',{emote:'angry'}],['surprise',{emote:'surprise'}],['note',{emote:'note'}],['sweat',{emote:'sweat'}],['sit',{sit:1}],['happy flex',{flex:1,emote:'heart'}]];
em.forEach(([n,o],i)=>chibi(g,(370+i*25),300,{ares:1,face:'down',...o},0,false));g.restore();
['front','side (right)','back','side (left)'].forEach((t,i)=>cap((40+i*36)*3,1000,t));cap(265*3,1000,'walk cycle (6 frames)');em.forEach(([n],i)=>cap((370+i*25)*3,1000,n));
g.font='bold 13px sans-serif';g.fillStyle='#9a8aa8';g.fillText('ARES · v0.0.1.6 · all art drawn in code · one look: red swim briefs, black fingerless gloves, red shades',20,1036);
</script></body></html>
